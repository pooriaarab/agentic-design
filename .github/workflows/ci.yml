name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: npm run build
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: npm run typecheck
      - run: npm run check:contrast
      - run: npm test
